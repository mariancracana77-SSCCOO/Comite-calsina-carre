<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Carretilla elevadora con una caja en las palas, para añadir al logo del comité (img/icon-512.png). Mira hacia la izquierda (hacia las personas). -->
  <defs>
    <linearGradient id="plata" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#e3ebf5"/><stop offset="1" stop-color="#a9bcd3"/>
    </linearGradient>
    <linearGradient id="caja" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c3d3e6"/>
    </linearGradient>
    <radialGradient id="rueda" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#2a4a78"/><stop offset="1" stop-color="#0B1E3C"/>
    </radialGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
  </defs>
  <g transform="translate(476,355) scale(-1.05,1.05)" filter="url(#sombra)">
    <!-- tejadillo y postes -->
    <rect x="13" y="6" width="50" height="7" rx="3" fill="url(#plata)"/>
    <rect x="16" y="9" width="6" height="40" rx="2" fill="url(#plata)"/>
    <path d="M56 10 L62 10 L67 50 L61 50 Z" fill="url(#plata)"/>
    <!-- asiento -->
    <path d="M24 46 L24 34 Q24 30 28 30 L31 30 L33 42 L42 42 Q45 42 45 46 Z" fill="#9fb3cc"/>
    <!-- cuerpo y contrapeso -->
    <path d="M3 64 Q3 47 17 46 L60 46 L69 58 L69 80 L3 80 Z" fill="url(#plata)"/>
    <rect x="10" y="62" width="40" height="4" rx="2" fill="#0E5FAE" opacity="0.8"/>
    <!-- mástil -->
    <rect x="69" y="52" width="6" height="10" fill="#9fb3cc"/>
    <rect x="73" y="0" width="7" height="86" rx="2" fill="url(#plata)"/>
    <!-- caja sobre las palas -->
    <rect x="82" y="47" width="32" height="34" rx="2.5" fill="url(#caja)" stroke="#9fb3cc" stroke-width="1"/>
    <rect x="82" y="61" width="32" height="6" fill="#00C6FF" opacity="0.9"/>
    <!-- palas -->
    <rect x="78" y="42" width="5" height="44" rx="1.5" fill="#c9d6e6"/>
    <rect x="78" y="81" width="36" height="5" rx="2" fill="url(#plata)"/>
    <!-- ruedas -->
    <circle cx="19" cy="82" r="12" fill="url(#rueda)" stroke="#c9d6e6" stroke-width="2"/>
    <circle cx="19" cy="82" r="4.5" fill="#c9d6e6"/>
    <circle cx="55" cy="82" r="13" fill="url(#rueda)" stroke="#c9d6e6" stroke-width="2"/>
    <circle cx="55" cy="82" r="5" fill="#c9d6e6"/>
  </g>
</svg>
