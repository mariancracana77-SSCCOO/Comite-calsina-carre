  <linearGradient id="metalV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8ea7c3"/><stop offset=".45" stop-color="#ffffff"/><stop offset="1" stop-color="#9fb6cf"/></linearGradient>
  <linearGradient id="cian" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0E5FAE"/><stop offset=".5" stop-color="#00C6FF"/><stop offset="1" stop-color="#0E5FAE"/></linearGradient>
  <linearGradient id="luz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfefff" stop-opacity=".30"/><stop offset="1" stop-color="#bfefff" stop-opacity="0"/></linearGradient>
  <linearGradient id="suelo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d2a4f"/><stop offset="1" stop-color="#061428" stop-opacity="0"/></linearGradient>
  <linearGradient id="noche" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B2B4E"/><stop offset="1" stop-color="#03172D"/></linearGradient>
  <filter id="brillo" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="brilloS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
