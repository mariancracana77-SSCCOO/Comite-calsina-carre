<!doctype html>
<!-- Imagen para compartir (img/og.png, 1200x630). Se hace con Playwright: ver herramientas/LEEME-og.txt -->
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../fuentes.css">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:Inter,sans-serif;color:#fff;
 background:radial-gradient(55% 80% at 90% 5%,rgba(0,198,255,.25),transparent 60%),radial-gradient(70% 110% at 0% 100%,rgba(14,95,174,.5),transparent 60%),linear-gradient(180deg,#0B1E3C,#081630);position:relative}
.arco{position:absolute;border-radius:50%;border:3px solid rgba(0,198,255,.35)}
.a1{width:1500px;height:1500px;right:-700px;top:-1180px;box-shadow:0 0 50px rgba(0,198,255,.2)}
.a2{width:1600px;height:1600px;left:-1100px;bottom:-1420px;border-color:rgba(0,198,255,.22)}
.txt{position:absolute;left:70px;top:110px;width:520px}
.logo{display:flex;align-items:center;gap:16px}
.logo img{width:72px;height:72px;border-radius:18px;box-shadow:0 0 0 2px rgba(0,198,255,.45)}
.logo b{display:block;font:800 30px Montserrat;text-transform:uppercase;letter-spacing:.02em}
.logo small{display:block;font:700 15px Montserrat;letter-spacing:.28em;text-transform:uppercase;color:#00C6FF;margin-top:4px}
h1{font:800 54px/1.08 Montserrat;margin-top:40px;letter-spacing:-.01em}
p{font-size:23px;color:rgba(255,255,255,.82);margin-top:18px;line-height:1.4}
.arte{position:absolute;right:0;top:175px;width:600px;aspect-ratio:1240/461;background:url(../img/hero-arte.webp) center/contain no-repeat;
 -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 90%,transparent),linear-gradient(180deg,transparent,#000 16%,#000 82%,transparent);-webkit-mask-composite:source-in}
ul{position:absolute;left:70px;right:70px;bottom:46px;list-style:none;padding:22px 0 0;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid rgba(255,255,255,.18)}
li{display:flex;align-items:center;justify-content:center;gap:10px;font:600 18px Inter;color:rgba(255,255,255,.9);white-space:nowrap}
li+li{border-left:1px solid rgba(0,198,255,.3)}
li svg{width:30px;height:30px;flex:none;color:#00C6FF}
</style></head><body>
<div class="arco a1"></div><div class="arco a2"></div>
<div class="txt">
  <div class="logo"><img src="../img/icon-192.png" alt=""><div><b>Calsina Carré</b><small>Comité de empresa</small></div></div>
  <h1>Tu comité de empresa,<br>siempre a mano</h1>
  <p>Avisos, reuniones, actas y buzón anónimo para toda la plantilla.</p>
</div>
<div class="arte"></div>

</body></html>
