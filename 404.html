<style>
  :root { --cab: #0B1E3C; --azul: #0E5FAE; --celeste: #00C6FF; --fondo: #F3F6FA; --tarjeta: #fff; --texto: #15212e; --suave: #556373; --foco: #0E5FAE; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --cab: #07142a; --azul: #4fb3ff; --fondo: #0c131c; --tarjeta: #141e2a; --texto: #e7edf4; --suave: #9fb0c2; --foco: #00C6FF; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html { font-size: 18px; -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--fondo); color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
  :focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; }
  .cab { background: var(--cab); color: #fff; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); }
  .cab div { display: flex; align-items: center; gap: 10px; max-width: 980px; margin: 0 auto; }
  .cab img { width: 48px; height: 48px; border-radius: 12px; box-shadow: 0 0 0 1px rgba(0, 198, 255, .35); flex: none; }
  .cab b { display: block; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; }
  .cab small { display: block; color: var(--celeste); text-transform: uppercase; letter-spacing: .2em; font-size: .7rem; }
  main { flex: 1; display: grid; place-items: center; padding: 24px 16px; }
  .caja { max-width: 520px; width: 100%; background: var(--tarjeta); border-radius: 14px; padding: 24px 20px; text-align: center;
    box-shadow: 0 1px 2px rgba(14, 42, 74, .06), 0 4px 14px rgba(14, 42, 74, .06); }
  .num { margin: 0; font-weight: 800; font-size: 3rem; line-height: 1; color: var(--azul); }
  h1 { margin: 10px 0 6px; font-size: 1.4rem; line-height: 1.2; }
  p { margin: 0 0 18px; color: var(--suave); }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 54px; padding: 10px 22px; border-radius: 12px;
    background: var(--azul); color: #fff; font-weight: 700; text-decoration: none; font-size: 1.05rem; }
  @media (prefers-color-scheme: dark) { .btn { color: #0c131c; } }
</style>
